<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중지해 관리자</title><style>body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f6f9fb;color:#163954}header{padding:20px 6vw;background:#fff;border-bottom:1px solid #d8e3ed;font-weight:800;font-size:21px}main{max-width:700px;margin:auto;padding:45px 5vw}.card{margin-top:22px;padding:26px;background:#fff;border:1px solid #d8e3ed;border-radius:16px}select,input{width:100%;margin:12px 0 20px;font:inherit}input{accent-color:#2485c2}.value{font-size:28px;font-weight:bold;background:#f2f7fb;padding:15px;border-radius:12px}button{margin-top:16px;padding:11px 16px;background:#2485c2;border:0;border-radius:8px;color:#fff;font-weight:bold}a{color:#2476b0;text-decoration:none}</style></head><body><header>중지해 · 관리자</header><main><a href="index.html">← 태풍 현황 지도로</a><h1>풍속 제어</h1><p>관리자 전용 시연 풍속 설정입니다.</p><section class="card"><label>항만</label><select id="port"><option value="incheon">인천항</option><option value="mokpo">목포항</option><option value="yeosu">여수항</option><option value="busan">부산항</option><option value="ulsan">울산항</option><option value="pohang">포항항</option></select><label>현재 풍속</label><input id="wind" type="range" min="1" max="30" step="0.1"><div class="value" id="value"></div><button id="save">저장</button> <span id="saved"></span></section></main><script>sessionStorage.setItem('jungihae-admin-mode','1');const b={incheon:8.4,mokpo:15.2,yeosu:22.9,busan:25.1,ulsan:24.7,pohang:16.5},p=document.querySelector('#port'),w=document.querySelector('#wind'),v=document.querySelector('#value'),s=document.querySelector('#saved');function show(){v.textContent=Number(w.value).toFixed(1)+' m/s';s.textContent=''}function load(){w.value=localStorage.getItem('jungihae-wind-'+p.value)||b[p.value];show()}p.onchange=load;w.oninput=show;document.querySelector('#save').onclick=()=>{localStorage.setItem('jungihae-wind-'+p.value,w.value);s.textContent='저장됨'};load();</script></body></html>
